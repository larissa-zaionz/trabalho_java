<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="music-container">
    <h1 id="titulo">Player Music</h1>
    <img id="capa" src="/imagens/twentyonepilots.webp" alt="Capa album twenty one pilots">
   <div id="abaixo-da-capa"> 
        <div id="info-music">
            <h2 id="song-name">Nome da musica</h2>
            <div id="band-name" class="color-transp">banda</div>
        </div>
            <div id="like" class="button color-transp"><i class="bi bi-heart"></i></div>
    </div>
    <div id="barra-de-progresso">
        <div id="progresso-atual"></div>
    </div>
    <div id="container-botao">
        <div id="embaralhar" class="button"><i class="bi bi-shuffle"></i></div>
        <div id="start" class="button button-navi"><i class="bi bi-skip-start-circle-fill"></i></div>
        <div id="play" class="button button-grande"><i class="bi bi-play-circle-fill"></i></div>
        <div id="end" class="button button-navi"><i class="bi bi-skip-end-circle-fill"></i></div>
        <div id="repeat" class="button"s><i class="bi bi-repeat"></i></div>
    </div>
</div>
<script src="/script.js"></script>
</body>
</html>
